{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
      <div class="flash flash--{{ category|default('info') }}" role="status">
        <span>{{ message }}</span>
        <button class="flash__close" type="button" aria-label="{{ t('common.close') }}">&times;</button>
      </div>
    {% endfor %}
  {% endif %}
{% endwith %}
