{% macro icon(name, size=24) -%}
<svg class="icon" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24"
     fill="none" stroke="currentColor" stroke-width="1.8"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {%- if name == 'book' -%}
    <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H11v16H6.5A2.5 2.5 0 0 0 4 21V5.5Z"/>
    <path d="M20 5.5A2.5 2.5 0 0 0 17.5 3H13v16h4.5A2.5 2.5 0 0 1 20 21V5.5Z"/>
  {%- elif name == 'device' -%}
    <rect x="3" y="7" width="18" height="12" rx="3"/>
    <path d="M7 7V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2"/>
    <path d="M7 11h10"/>
  {%- elif name == 'lamp' -%}
    <path d="M8 3h8l3 9H5L8 3Z"/>
    <path d="M12 12v6"/>
    <path d="M8 21h8"/>
  {%- elif name == 'ball' -%}
    <circle cx="12" cy="12" r="8"/>
    <path d="M4.5 9.5c4 1.5 11 1.5 15 0"/>
    <path d="M4.5 14.5c4-1.5 11-1.5 15 0"/>
  {%- elif name == 'shirt' -%}
    <path d="m8 4-4 2 2 4 2-1v10h8V9l2 1 2-4-4-2a4 4 0 0 1-8 0Z"/>
  {%- elif name == 'pen' -%}
    <path d="m15 4 5 5-9.5 9.5L4 20l1.5-6.5L15 4Z"/>
    <path d="m13 6 5 5"/>
  {%- elif name == 'search' -%}
    <circle cx="11" cy="11" r="6.5"/>
    <path d="m16 16 4 4"/>
  {%- elif name == 'heart' -%}
    <path d="M12 20s-7-4.3-7-9.5A3.8 3.8 0 0 1 12 8a3.8 3.8 0 0 1 7 2.5C19 15.7 12 20 12 20Z"/>
  {%- elif name == 'eye' -%}
    <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/>
    <circle cx="12" cy="12" r="2.8"/>
  {%- else -%}
    <path d="m4 8 8-4 8 4-8 4-8-4Z"/>
    <path d="M4 8v8l8 4 8-4V8"/>
    <path d="M12 12v8"/>
  {%- endif -%}
</svg>
{%- endmacro %}
